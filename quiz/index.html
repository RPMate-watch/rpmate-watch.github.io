<h1>Classic Control Quiz: Washing Machine Control Circuit</h1>
<div class="m">Open Friday 27 Nov 2026, 9:00 PM to 10:00 PM (Cairo time)</div>
<div id="app"></div>
</div>
<script>
var Q=[["في دايرة الغسالة الكلاسيك، وظيفة الـ Overload Relay هي:", ["حماية الموتور من زيادة التيار المستمر", "تشغيل الموتور بعد تأخير", "حماية الدايرة من القصر (Short Circuit)", "عكس اتجاه الدوران"]], ["الـ Self-holding (Seal-in) في دايرة التشغيل بيتعمل عن طريق:", ["NO من الكونتاكتور على التوازي مع زرار Start", "NC من الكونتاكتور على التوالي مع زرار Start", "NC على التوازي مع زرار Stop", "تايمر على التوالي مع Start"]], ["زرار الـ Stop بيتوصل في دايرة التحكم بنوع كونتاكت:", ["NC", "NO", "أي نوع", "مالوش لازمة"]], ["عشان الغسالة تدور يمين وشمال (Forward/Reverse)، لازم يتعمل:", ["كونتاكتورين مع Mechanical + Electrical Interlock", "كونتاكتور واحد بس", "كونتاكتورين من غير Interlock", "Overload Relay تاني"]], ["الـ Electrical Interlock هو:", ["NC من كل كونتاكتور بيتحط في ملف الكونتاكتور التاني", "NO من كل كونتاكتور على التوازي مع التاني", "فيوز على ملف الكونتاكتور", "تايمر بين الكونتاكتورين"]], ["الـ On-Delay Timer في الغسالة بيستخدم عشان:", ["يحسب زمن دورة الغسيل ويتحكم في التبديل بين الاتجاهين", "يفصل الموتور فورًا", "يحمي من التيار الزايد", "يزود الجهد"]], ["الـ Water Level Switch (حساس مستوى المية) بيتوصل في دايرة:", ["التحكم، عشان يسمح ببدء الغسيل لما المية توصل للمستوى", "القوى بس", "الأرضي", "مالوش علاقة بالدايرتين"]], ["الفرق الأساسي بين دايرة القوى (Power) ودايرة التحكم (Control):", ["القوى بتشغل الموتور بتيار عالي، والتحكم بتشغل الملفات بتيار وجهد أقل غالبًا", "مفيش فرق", "التحكم بتشغل الموتور مباشرة", "القوى فيها تايمرات بس"]], ["لو الموتور فصل فجأة والـ Overload Relay اشتغل، أول حاجة تعملها:", ["تفصل القوى، تدور على السبب (حمل زايد/ضبط غلط/عطل)، وبعدين Reset", "تعمل Reset على طول", "تعمل Bypass للأوفرلود", "تكبر الـ Setting"]], ["في دايرة القوى للـ Forward/Reverse، عشان نعكس اتجاه موتور 3 فاز بنبدّل:", ["فازتين من التلاتة", "الـ 3 فازات كلهم", "النيوترال مع فاز", "الأرضي مع فاز"]], ["الـ Contactor بيتكون من:", ["ملف (Coil) وكونتاكتات رئيسية ومساعدة", "ملف بس من غير كونتاكتات", "تايمر وفيوز", "مقاومة وكوندنسر"]], ["لو ضغطت Start وفضل الكونتاكتور شغال بعد ما سيبت الزرار، ده معناه إن:", ["الـ Self-holding شغال صح", "الـ Stop بايظ", "الـ Overload فصل", "الـ Interlock بايظ"]], ["الـ Normally Closed (NC) كونتاكت معناه:", ["مقفول في الحالة العادية ويفتح لما يتفعّل", "مفتوح في الحالة العادية ويقفل لما يتفعّل", "دايمًا مفتوح", "دايمًا مقفول"]], ["الغرض من الـ Fuse أو الـ Circuit Breaker في دايرة القوى هو:", ["حماية الدايرة من القصر (Short Circuit)", "عكس اتجاه الموتور", "التحكم في السرعة", "عد الوقت"]], ["في دايرة الغسالة، ليه بنحط Delay (تايمر) بين تغيير الاتجاه من يمين لشمال؟", ["عشان الموتور يقف تمامًا قبل ما يعكس، وده بيحمي الكونتاكتورات والموتور", "عشان نوفر كهربا", "عشان نزود سرعة الموتور", "مالوش لازمة"]]];
